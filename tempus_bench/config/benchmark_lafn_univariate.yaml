# LAFN on all catalog univariate tasks (Chronarium checkpoint in settings.yaml).
# From repository root:
#   conda run -n tempus_bench python -m tempus_bench.run_benchmark \
#     --config tempus_bench/config/benchmark_lafn_univariate.yaml

evaluation:
  task_path: 'univariate/*'
  tuning_loss: mae
  max_windows: 4
  max_num_variates: 10
  num_samples: 100
  num_quantiles: 10
  point_forecast_statistic: mean

model:
  lafn: {}
