# Main configuration for the benchmarking pipeline
# This file provides sensible defaults for all configuration options

evaluation:
  task_path: 'multivariate/baggage_100_multivariate'
  tuning_loss: mae
  max_windows: 4
  max_num_variates: 10
  num_samples: 100
  num_quantiles: 10
  point_forecast_statistic: mean

model:

  seasonal_naive:
    sp: [12, 24]

  # Deterministic Models
  arima:
    p: [1, 2]
    d: [1]
    q: [1, 2]
    s: [2]

  croston_classic:
    alpha: [0.1, 0.3, 0.5]
    gamma: [0.1, 0.3, 0.5]

  exponential_smoothing:
    trend: ["null", "add"]
    seasonal: ["null"]
    seasonal_periods: [4, 8, 16, 32]

  lstm:
    learning_rate: [0.01, 0.001, 0.0001]

  prophet:
    seasonality_mode: [additive]
    changepoint_prior_scale: [0.05]
    seasonality_prior_scale: [10.0]

  random_forest:
    n_estimators: [10]
    max_depth: [2]


  theta:
    sp: [12]
    theta_method: [correlation_optimal]
    use_reduced_rank: [false]

  varmax:
    p: [1, 2]
    q: [1, 2]
    trend: [c, t]

  # xgboost:
  #   n_estimators: [200]
  #   max_depth: [4]
  #   learning_rate: [0.05, 0.01, 0.001]


  moment_large: {}
  timesfm_200m: {}
  tiny_time_mixer_r1: {}

  # Stochastic models
  chronos_tiny: {}

  moirai_base: {}
  moirai_moe: {}

  lagllama: {}
  toto: {}
  tabpfn: {}

  lafn: {}
