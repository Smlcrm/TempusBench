# Local smoke: one small foundation model × univariate, multivariate, covariate.
# From repository root:
#   python -m tempus_bench.run_benchmark --config tempus_bench/config/local_foundation_smoke.yaml
#
# Uses conda env benchmark.chronos_tiny (see tempus_bench/config/settings.yaml).

evaluation:
  task_paths:
    - univariate/univariate_climate_daily_mean_humidity_delhi
    - multivariate/multivariate_transport_monthly_airline_baggage_complaints
    - covariate/covariate_transport_monthly_airline_baggage_complaints
  tuning_loss: mae
  max_windows: 1
  max_num_variates: 4
  num_samples: 5
  num_quantiles: 3
  point_forecast_statistic: mean

model:
  chronos_tiny: {}
