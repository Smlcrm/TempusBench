# Default configuration for stochastic benchmarking pipeline
# This file provides sensible defaults for all configuration options for stochastic tasks

task:
  task_type: stochastic
  forecast_horizon: 25
  context_window: 50
  dataset:
    name: "*"  # Use all available datasets
    normalize: true
    handle_missing: interpolate

evaluation:
  metrics: [crps, quantile_score, weighted_interval_score]
  tuning_loss: mae
  max_windows: 20
  max_num_variates: 10
  num_samples: 100
  num_quantiles: 10
  point_forecast_statistic: mean

model:
  # Stochastic models only - these generate probabilistic forecasts
  chronos: {}
  deepar: {}
  lagllama: {}
  moirai: {}
  moirai_moe: {}
  toto: {}

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_logging: true
  console_logging: true
  tensorboard_logging: true

paths:
  runs_dir: "runs"
  datasets_dir: "tempus_bench/datasets"
  models_dir: "tempus_bench/models"

system:
  python_version: "3.11"
  conda_env_prefix: "benchmark"
