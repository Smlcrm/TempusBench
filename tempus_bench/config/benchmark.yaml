# Main configuration for the benchmarking pipeline
# This file provides sensible defaults for all configuration options

# Tunable models keep Cartesian products
# below 32 configurations; foundation models use empty grids {}.

evaluation:
  task_path: '*'
  tuning_loss: mae
  max_windows: 4
  max_num_variates: 10
  num_samples: 100
  num_quantiles: 10
  point_forecast_statistic: median

model:
  # Statistical baselines
  seasonal_naive:
    sp: [4, 7, 12, 24, 52]  # 5

  arima:
    p: [1, 2, 3]
    d: [0, 1, 2]
    q: [1, 2, 3]
    s: [1, 12]  # 24

  croston_classic:
    alpha: [0.1, 0.3, 0.5, 0.7, 0.9]
    gamma: [0.1, 0.3, 0.5, 0.7, 0.9]  # 25

  exponential_smoothing:
    trend: ["null", "add", "mul"]
    damped_trend: [false]
    seasonal: ["null", "add"]
    seasonal_periods: [7, 12, 24, 52]  # 24

  prophet:
    seasonality_mode: [additive, multiplicative]
    changepoint_prior_scale: [0.001, 0.05, 0.5]
    seasonality_prior_scale: [1.0, 10.0, 20.0]  # 18

  theta:
    sp: [4, 7, 12, 24, 52]
    theta_method: [correlation_optimal, least_squares]
    use_reduced_rank: [false]  # 10

  # Classical ML
  lstm:
    learning_rate: [0.01, 0.001, 0.0001]
    units: [32, 64, 128]
    layers: [1, 2]  # 18

  random_forest:
    n_estimators: [50, 100, 200, 400]
    max_depth: [4, 8, 16]
    min_samples_leaf: [1, 4]  # 24

  svr:
    kernel: [rbf, linear]
    C: [0.1, 1.0, 10.0, 100.0]
    epsilon: [0.01, 0.1]
    gamma: [scale]  # 16

  xgboost:
    n_estimators: [100, 200, 400]
    max_depth: [3, 5, 7]
    learning_rate: [0.1, 0.05, 0.01]  # 27

  # Neural / deep forecasting
  nbeats:
    input_size: [64, 128, 256]
    max_steps: [25, 50, 100]
    batch_size: [32, 64]  # 18

  nhits:
    input_size: [64, 128, 256]
    max_steps: [25, 50, 100]
    batch_size: [32, 64]  # 18

  itransformer: {}

  patchtsmixer:
    context_length: [128, 256]
    patch_length: [8, 16]
    stride: [8]
    num_epochs: [25, 50]
    learning_rate: [0.001, 0.0001]  # 16

  patchtst_fm:
    stochastic_samples: [25, 50, 100, 200, 500]  # 5

  patchtst_granite: {}

  # Foundation models — deterministic
  moment_small: {}
  moment_base: {}
  moment_large: {}
  timesfm_200m: {}
  time_moe_50m: {}
  time_moe_200m: {}
  tiny_time_mixer_r1: {}
  tiny_time_mixer_r2: {}
  tiny_time_mixer_r2_1: {}

  # Foundation models — stochastic
  chronos_tiny: {}
  chronos_mini: {}
  chronos_small: {}
  chronos_base: {}
  chronos_large: {}
  chronos_bolt_tiny: {}
  chronos_bolt_mini: {}
  chronos_bolt_small: {}
  chronos_bolt_base: {}
  chronos2: {}
  chronos2_small: {}
  timesfm2: {}
  timesfm_500m: {}
  granite_flowstate: {}
  kairos_10m: {}
  kairos_23m: {}
  kairos_50m: {}
  moirai_small: {}
  moirai_base: {}
  moirai_large: {}
  moirai_moe: {}
  moirai2: {}
  lagllama: {}
  toto: {}
  tabpfn_ts: {}
  tirex: {}
  tirex_1_1_gifteval: {}
  sundial: {}
