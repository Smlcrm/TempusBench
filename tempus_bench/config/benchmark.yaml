# Main configuration for the benchmarking pipeline
# This file provides sensible defaults for all configuration options

task_path: 'multivariate/baggage_100_multivariate'

evaluation:
  tuning_loss: mae
  max_windows: 20
  max_num_variates: 10
  num_samples: 100
  num_quantiles: 10
  point_forecast_statistic: mean

model:
  # Deterministic
  arima:
    p: [1, 2]
    d: [1]
    q: [1, 2]
    s: [2]

  croston_classic:
    alpha: [0.1, 0.3, 0.5]
    gamma: [0.1, 0.3, 0.5]

  exponential_smoothing:
    trend: [add, mul, null]
    damped_trend: [false, true]

  lstm:
    units: [32]
    layers: [1]
    dropout: [0.1]
    learning_rate: [0.001]

  moment: {}

  prophet:
    seasonality_mode: [additive]
    changepoint_prior_scale: [0.05]
    seasonality_prior_scale: [10.0]

  random_forest:
    n_estimators: [10]
    max_depth: [2]

  seasonal_naive:
    sp: [24]

  theta:
    sp: [12]
    theta_method: [correlation_optimal]

  xgboost:
    n_estimators: [200]
    max_depth: [4]
    learning_rate: [0.05]
    # subsample: [0.9]  # Moved to Optional with default 0.9 in Params
    # colsample_bytree: [0.9]  # Moved to Optional with default 0.9 in Params
    # random_state: [42]  # Not important for hyperparameter tuning
    # n_jobs: [1]  # Not important for hyperparameter tuning


  svr:
    kernel: [rbf]
    C: [1.0]
    # epsilon: [0.1]  # Moved to Optional with default 0.1 in Params
    # gamma: [scale]  # Moved to Optional with default scale in Params
    # lookback_window: [30]  # Moved to settings.yaml
    # forecast_horizon: [25]  # Not important for hyperparameter tuning

  varmax:
    p: [1, 2]
    q: [1, 2]
    # trend: [c]  # Moved to Optional with default "c" in Params

  # Foundation models (no hyperparameters)
  chronos: {}
  deepar: {}
  tiny_time_mixer: {}
  moirai: {}
  moirai_moe: {}
  timesfm: {}
  lagllama: {}
  toto: {}
  tabpfn: {}
