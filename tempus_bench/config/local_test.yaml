# Local smoke: LSTM + random_forest on univariate and multivariate tasks only.
# (random_forest does not declare covariate support — omit covariate/* paths here.)
# From repository root:
#   python -m tempus_bench.run_benchmark --config tempus_bench/config/local_test.yaml

evaluation:
  task_paths:
    - univariate/univariate_climate_daily_mean_humidity_delhi
    - multivariate/multivariate_transport_monthly_airline_baggage_complaints
  tuning_loss: mae
  max_windows: 1
  max_num_variates: 4
  num_samples: 5
  num_quantiles: 3
  point_forecast_statistic: mean

model:
  # svr:
  #   kernel: ["linear"]
  #   C: [0.5]

  lstm:
    learning_rate: [0.01]

  random_forest:
      n_estimators: [10]
      max_depth: [2]