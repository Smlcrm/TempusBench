# Default configuration for the benchmarking pipeline
# This file provides sensible defaults for all configuration options

task:
  task_type: deterministic
  forecast_horizon: 25
  context_window: 50
  dataset:
    name: "*"  # Use all available datasets
    normalize: true
    handle_missing: interpolate

evaluation:
  metrics: [mae, rmse, mape, mase]
  tuning_loss: mae
  max_windows: 20
  max_num_variates: 10

model:
  # Traditional models with hyperparameter grids
  exponential_smoothing:
    trend: [add]
    seasonal: [null]
    seasonal_periods: [null]
    damped_trend: [false, true]

  seasonal_naive:
    sp: [24]

  croston_classic:
    alpha: [0.1, 0.3, 0.5]
    gamma: [0.1, 0.3, 0.5]

  theta:
    sp: [12]
    theta_method: [correlation_optimal]

  arima:
    p: [1, 2]
    d: [1]
    q: [1, 2]
    s: [2]

  xgboost:
    lookback_window: [30]
    n_estimators: [200]
    max_depth: [4]
    learning_rate: [0.05]
    subsample: [0.9]
    colsample_bytree: [0.9]
    random_state: [42]
    n_jobs: [1]

  random_forest:
    lookback_window: [50]
    n_estimators: [10]
    max_depth: [2]
    random_state: [42]
    n_jobs: [1]
    forecast_horizon: [50]

  svr:
    kernel: [rbf]
    C: [1.0]
    epsilon: [0.1]
    gamma: [scale]
    lookback_window: [30]
    forecast_horizon: [25]

  prophet:
    seasonality_mode: [additive]
    changepoint_prior_scale: [0.05]
    seasonality_prior_scale: [10.0]
    # yearly_seasonality: [true]
    weekly_seasonality: [true]
    daily_seasonality: [false]

  lstm:
    units: [32]
    layers: [1]
    dropout: [0.1]
    learning_rate: [0.001]
    batch_size: [16]
    epochs: [30]
    sequence_length: [10]
    forecast_horizon: [25]

  # Foundation models (no hyperparameters)
  chronos: {}
  tiny_time_mixer: {}
  moirai: {}
  moirai_moe: {}
  moment: {}
  timesfm: {}
  lagllama: {}
  toto: {}
  tabpfn: {}

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_logging: true
  console_logging: true
  tensorboard_logging: true

paths:
  runs_dir: "runs"
  datasets_dir: "tempus_bench/datasets"
  models_dir: "tempus_bench/models"

system:
  python_version: "3.11"
  conda_env_prefix: "benchmark"
