# Example user configuration that overrides only specific settings
# This demonstrates how users can provide minimal configs that merge with defaults

task:
  task_type: deterministic
  forecast_horizon: 10
  context_window: 20
  dataset:
    name: "univariate/*"  # Only use univariate datasets
    normalize: true
    handle_missing: interpolate

evaluation:
  metrics: [rmse, mae]  # Only use these two metrics
  tuning_loss: rmse
  max_windows: 5
  max_num_variates: 5

model:
  # Only test these specific models
  exponential_smoothing:
    trend: [add]
    seasonal: [null]
    seasonal_periods: [null]
    damped_trend: [false]
  
  seasonal_naive:
    sp: [12]
  
  # Foundation models (no hyperparameters needed)
  chronos: {}
  moment: {}

# Note: paths, logging, and system settings will be inherited from default.yaml
