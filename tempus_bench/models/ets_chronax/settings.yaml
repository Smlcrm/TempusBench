model_type: deterministic
python_version: '3.11'
device: cpu
foundation: false
capabilities:
  covariates: none
  univariate: true
  multivariate: true
default_hyperparameter_grid:
  season_length: [1, 4, 7, 12]
  model: ['ANN', 'AAN', 'AAA', 'MAM', 'MNN']
  damped: [true, false]
  phi: [0.8, 0.9, 0.98]
  max_iter: [100, 200]
  optax_lr: [0.001, 0.01, 0.1]
  optax_clip: [1.0, 5.0]
