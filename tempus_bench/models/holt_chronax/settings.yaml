model_type: deterministic
python_version: '3.11'
device: cpu
foundation: false
capabilities:
  covariates: none
  univariate: true
  multivariate: true
default_hyperparameter_grid:
  season_length: [1]
  error_type: ['A', 'M']
  damped: [true, false]
  phi: [0.8, 0.9, 0.98]
  allow_extended_iterations: [true, false]
  iteration_scaling: ['quadratic', 'cubic']
