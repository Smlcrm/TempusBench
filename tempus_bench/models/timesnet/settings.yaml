model_type: deterministic
python_version: '3.12'
# Batch: highmem_16_128 + cpu-job. NeuralForecast Lightning uses CPU when device is cpu.
device: cpu
capabilities:
  covariates: future_only
  univariate: true
  multivariate: true
foundation: false
default_hyperparameter_grid:
  # Same grid as tft: short lookback + 25 Lightning steps (batch_size default 64, not in grid).
  input_size: [128, 256]
  max_steps: [25]
