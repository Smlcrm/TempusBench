task:
  task_type: stochastic
  forecast_horizon: 20
  context_window: 512
  max_windows: 20
  max_num_variates: 1
  dataset:
    name: univariate/inventories_months_univariate
    normalize: true
    handle_missing: interpolate
evaluation:
  metrics:
  - crps
  - quantile_score
  - weighted_interval_score
  - mae
  - rmse
  logging: true
  tuning_loss: mae
model:
  chronos: {}
  deepar: {}
  lagllama: {}
  moirai: {}
  moirai_moe: {}
  toto: {}
