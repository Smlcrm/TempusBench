# TempusBench tasks — consolidated task configurations.
# Mirrors each task folder's task.yaml. Regenerate with:
#   python tempus_bench/scripts/generate_tasks_task_yaml.py
# 
# Shared defaults across tasks:
#   handle_missing: interpolate — matches legacy tasks/ benchmark preprocessing.
#   normalization_method: standard — replaces legacy dataset.normalize: true (StandardScaler).
# 
# Multivariate tasks support two evaluation modes from one CSV:
#   multivariate_target_variable_names — all exported variates (joint multivariate forecasting).
#   covariate_target_variable_name + covariate_variable_names — single-target forecasting with
#     the remaining variates as covariates.
# Univariate tasks use target_variable_names only (covariate_variable_names is []).
tasks:

  univariate_economics_weekly_federal_funds_effective_rate:
    rel_path: univariate/univariate_economics_weekly_federal_funds_effective_rate
    # Legacy reference: tempus_bench/tasks/univariate/federal_funds_weeks_univariate.
    # context_window=1024, forecast_horizon=64 — kept from legacy; long weekly macro series (~3750 steps).
    # Single target (federal_funds_effective_rate_us); no covariates — standard univariate benchmark.
    task:
      context_window: 1024
      forecast_horizon: 64
      handle_missing: interpolate
      normalization_method: standard
      file_name: univariate_economics_weekly_federal_funds_effective_rate.csv
      target_variable_names:
      - federal_funds_effective_rate_us
      covariate_variable_names: []
    # number of targets : 1
    # number of covariates : 0
    # number of time-steps : 3750

  univariate_energy_monthly_electricity_price_kwh:
