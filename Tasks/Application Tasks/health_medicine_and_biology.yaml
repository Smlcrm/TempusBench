task:
  task_name: M01AB Acetic Acid NSAIDs
  task_description: Weekly forecasting of M01AB acetic-acid NSAID dispensing units
    for pharmacy inventory and demand planning, with weather and influenza-like-illness
    covariates.
  context_window: 104
  forecast_horizon: 13
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: health_medicine_and_biology
  dataset_name: M01AB_Acetic_Acid_NSAIDs
  target_variable_names:
  - m01ab acetic acid units
  covariate_variable_names:
  - mean temperature
  - min temperature
  - max temperature
  - precipitation
  - snowfall
  - max wind speed
  - shortwave radiation
  - weighted influenza-like illness
  - influenza-like illness
