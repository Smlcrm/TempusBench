task:
  task_name: COVID-19 Daily Counts of Cases, Hospitalizations, and Deaths Multivariate
  task_description: Granular epidemiological dataset tracking COVID-19 confirmed and
    probable cases, hospitalizations, and deaths across New York City. The data provides
    both city-wide aggregates and specific regional breakdowns across all five boroughs
    (Bronx, Brooklyn, Manhattan, Queens, Staten Island), making it an ideal benchmark
    for spatial-temporal infectious disease modeling.
