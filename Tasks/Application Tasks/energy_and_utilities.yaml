task:
  task_name: 'Average Price: Electricity per Kilowatt-Hour in U.S. City Average'
  task_description: All electricity. Average consumer prices are calculated for household
    fuel, motor fuel, and food items from prices collected for the Consumer Price
    Index (CPI). Average prices are best used to measure the price level in a particular
    month, not to measure price change over time. It is more appropriate to use CPI
    index values for the particular item categories to measure price change. Prices,
    except for electricity, are collected monthly by BLS representatives in the 75
    urban areas priced for the CPI. Electricity prices are collected for the BLS for
    the same 75 areas on a monthly basis by the Department of Energy using mail questionnaires.
    All fuel prices include applicable Federal, State, and local taxes; prices for
    natural gas and electricity also include fuel and purchased gas adjustments.
  context_window: 128
  forecast_horizon: 39
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: energy_and_utilities
  dataset_name: Monthly_Electricity_Price_KWh
  target_variable_names:
  - electricity price per kilowatt hour United States city average
  covariate_variable_names: []
