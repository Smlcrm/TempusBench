task:
  task_name: MLB Dodgers Run Differential Daily
  task_description: Daily forecasting of the 2024 Los Angeles Dodgers per-game run
    differential from offensive and defensive box-score covariates.
  context_window: 131
  forecast_horizon: 30
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: sports_recreation_and_fitness
  dataset_name: MLB_Dodgers_Run_Differential_Daily
  target_variable_names:
  - run differential
  covariate_variable_names:
  - hits
  - home runs
  - walks
  - hits allowed
  - home runs allowed
  - walks allowed
