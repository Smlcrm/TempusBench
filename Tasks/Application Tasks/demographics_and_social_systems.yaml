task:
  task_name: Chicago Monthly Crime Counts
  task_description: Monthly forecasting of reported Chicago crime incidents for police
    patrol and resource allocation, with weather and unemployment covariates.
  context_window: 120
  forecast_horizon: 12
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: demographics_and_social_systems
  dataset_name: Chicago_Monthly_Crime_Counts
  target_variable_names:
  - reported crime incidents
  covariate_variable_names:
  - chicago mean temperature
  - us unemployment rate
