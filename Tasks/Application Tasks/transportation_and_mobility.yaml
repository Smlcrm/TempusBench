task:
  task_name: Capital Bikeshare Daily Trips
  task_description: Daily forecasting of Capital Bikeshare rental trips for fleet
    rebalancing and staffing (Washington DC), with weather covariates.
  context_window: 365
  forecast_horizon: 28
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: transportation_and_mobility
  dataset_name: Capital_Bikeshare_Daily_Trips
  target_variable_names:
  - bike trips
  covariate_variable_names:
  - temp
  - atemp
  - hum
  - windspeed
  - weathersit
