task:
  task_name: Airline Baggage Complaints
  task_description: A multivariate transport logistics dataset tracking monthly observations
    from 2004 to 2010 for major US airlines. By juxtaposing total passenger complaints
    regarding lost or damaged baggage against total scheduled flights, cancellations,
    and boarded passengers, this data allows models to forecast operational friction
    and its subsequent impact on customer satisfaction in the aviation industry.
  context_window: 32
  forecast_horizon: 8
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: transportation_and_mobility
  dataset_name: Monthly_Airline_Baggage_Complaints
  target_variable_names:
  - baggage complaints
  covariate_variable_names:
  - scheduled flights
  - cancelled flights
  - enplaned passengers
