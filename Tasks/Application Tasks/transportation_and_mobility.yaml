task:
  task_name: Air transport, passengers carried
  task_description: Annual observations tracking the total number of domestic and
    international aircraft passengers of air carriers registered in the country. For
    this univariate dataset, we are extracting and using only the historical data
    specific to the United States.
  context_window: 32
  forecast_horizon: 8
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: transportation_and_mobility
  dataset_name: Annual_US_Air_Passengers
  target_variable_names:
  - air transport passengers carried United States
  covariate_variable_names: []
