task:
  task_name: Skoltech Anomaly Benchmark (SKAB)
  task_description: The Skoltech Anomaly Benchmark (SKAB) is designed for evaluating
    algorithms in industrial IoT using sensor data from a physical water-circulation
    testbed. Measurements are recorded at 1-second intervals. For this univariate
    dataset, we are using only the pressure column from the anomaly-free.csv file.
  context_window: 2048
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: manufacturing_and_industrial_production
  dataset_name: Seconds_SKAB_Pressure
  target_variable_names:
  - SKAB anomaly-free pressure
  covariate_variable_names: []
---
task:
  task_name: Skoltech Anomaly Benchmark (SKAB)
  task_description: A high-frequency physical testbed dataset specifically engineered
    for predictive maintenance and industrial anomaly detection. It tracks continuous
    1-second telemetry from eight distinct sensors—including vibrations, pressure
    dynamics, and volume flow rates—mounted on a functioning water-circulation loop,
    capturing both steady-state operations and mechanically injected faults.
  context_window: 2048
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: manufacturing_and_industrial_production
  dataset_name: Seconds_SKAB_Pressure_Covariate
  target_variable_names:
  - pressure
  covariate_variable_names:
  - accelerometer 1 RMS
  - accelerometer 2 RMS
  - electrical current
  - temperature
  - thermocouple temperature
  - voltage
  - volume flow rate RMS
