task:
  task_name: CyberTec IIoT Malware Dataset
  task_description: A cutting-edge cybersecurity dataset capturing hourly network
    traffic and system health logs across an Industrial Internet of Things (IIoT)
    environment. It merges low-level network behaviors (packet entropy, flow duration)
    with system resource utilization (CPU/Memory) to facilitate AI-driven classification
    of zero-day intrusions, ransomware, botnets, and data exfiltration attempts.
  context_window: 2048
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: technology_media_and_communication
  dataset_name: Hourly_CyberTec_IIoT_Malware
  target_variable_names:
  - malicious signatures
  covariate_variable_names:
  - packet size
  - packet length
  - inter-arrival time
  - flow duration
  - total packets
  - total bytes
  - average packet size
  - packet arrival rate
  - payload entropy
  - flow entropy
  - baseline deviation
  - packet size variance
  - embedded commands
  - device activity patterns
  - cpu usage
  - memory usage
  - network interface stats
  - duration anomaly
  - known ioc
  - c&c communication
  - data exfiltration
