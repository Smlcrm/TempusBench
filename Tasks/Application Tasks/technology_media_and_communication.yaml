task:
  task_name: Software Development Job Postings on Indeed in the United States
  task_description: Indeed calculates the index change in seasonally-adjusted job
    postings since February 1, 2020, the pre-pandemic baseline. Indeed seasonally
    adjusts each series based on historical patterns in 2017, 2018, and 2019. Each
    series, including the national trend, occupational sectors, and sub-national geographies,
    is seasonally adjusted separately. Indeed switched to this new methodology in
    December 2022 and now reports all historical data using this new methodology.
    Historical numbers have been revised and may differ significantly from originally
    reported values. The new methodology applies a detrended seasonal adjustment factor
    to the index change in job postings. For more information, see Frequently Asked
    Questions regarding Indeed Data.
  context_window: 512
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: technology_media_and_communication
  dataset_name: Daily_Software_Dev_Postings_Indeed
  target_variable_names:
  - software development job postings United States Indeed
  covariate_variable_names: []
