task:
  task_name: Daily Corn Futures
  task_description: Daily forecasting of Chicago Board of Trade front-month corn futures
    settlement prices from related grain and oilseed futures, crude oil, and local
    weather covariates.
  context_window: 252
  forecast_horizon: 20
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: agriculture_and_resource_extraction
  dataset_name: Daily_Corn_Futures
  target_variable_names:
  - Chicago Board of Trade corn front month settlement
  covariate_variable_names:
  - Chicago Board of Trade soybeans front month settlement
  - Chicago Board of Trade wheat front month settlement
  - West Texas Intermediate crude oil front month settlement
  - daily mean temperature Des Moines Iowa
  - daily precipitation Des Moines Iowa
