task:
  task_name: Monthly Coal Mining Output
  task_description: Monthly forecasting of U.S. coal mining industrial production
    from related mining and industrial output indices and energy and metal commodity
    prices.
  context_window: 120
  forecast_horizon: 12
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: agriculture_and_resource_extraction
  dataset_name: Monthly_Coal_Mining_Output
  target_variable_names:
  - coal mining industrial production
  covariate_variable_names:
  - metal ore mining industrial production
  - coal mining producer price index
  - total mining industrial production
  - total industrial production
  - henry hub natural gas front month settlement
  - Commodity Exchange copper front month settlement
