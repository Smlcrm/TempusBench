task:
  task_name: Federal Funds Effective Rate
  task_description: The federal funds rate is the interest rate at which depository
    institutions trade federal funds (balances held at Federal Reserve Banks) with
    each other overnight. When a depository institution has surplus balances in its
    reserve account, it lends to other banks in need of larger balances. In simpler
    terms, a bank with excess cash, which is often referred to as liquidity, will
    lend to another bank that needs to quickly raise liquidity. The weighted average
    rate for these overnight negotiations is the effective federal funds rate. The
    Federal Open Market Committee (FOMC) sets a target for the federal funds rate
    and influences it through open market operations.
  context_window: 1024
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: finance_and_economics
  dataset_name: Weekly_Federal_Funds_Effective_Rate
  target_variable_names:
  - federal funds effective rate United States
  covariate_variable_names: []
