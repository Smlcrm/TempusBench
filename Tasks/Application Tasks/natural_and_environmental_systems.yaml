task:
  task_name: 2001-2022 Hourly dataset of pollution in Madrid Multivariate
  task_description: A massive, two-decade-long atmospheric dataset collected from
    24 environmental monitoring stations across Madrid. It tracks hourly concentrations
    of highly specific pollutants including particulate matter (PM10, PM2.5), nitrogen
    oxides, ozone, and sulfur dioxide. Highly valuable for identifying seasonal climate
    trends, daily urban traffic cycles, and the long-term impact of emission policies.
  context_window: 2048
  forecast_horizon: 64
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: natural_and_environmental_systems
  dataset_name: Hourly_Madrid_Air_Pollution_Multivariate
  target_variable_names:
  - benzene concentration
  - methane concentration
  - carbon monoxide concentration
  - ethylbenzene concentration
  - non-methane hydrocarbons concentration
  - nitric oxide concentration
  - nitrogen dioxide concentration
  - nitrogen oxides concentration
  - ozone concentration
  - PM10 concentration
  - PM2.5 concentration
  - sulfur dioxide concentration
  - toluene and xylenes concentration
  - toluene concentration
  covariate_variable_names: []
