task:
  task_name: Walmart Sales
  task_description: Comprehensive retail dataset capturing weekly revenue figures
    across multiple stores, heavily enriched with external covariates. Models must
    leverage regional environmental factors (air temperature), logistical costs (fuel
    prices), macroeconomic indicators (unemployment, CPI), and seasonal spikes (holiday
    flags) to accurately predict purchasing power and consumer demand.
  context_window: 45
  forecast_horizon: 16
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: commerce_and_trade
  dataset_name: Weekly_Walmart_Sales
  target_variable_names:
  - weekly sales
  covariate_variable_names:
  - holiday flag
  - temperature
  - fuel price
  - consumer price index
  - unemployment rate
