task:
  task_name: Real Residential Property Prices for Germany
  task_description: Quarterly observations of the real (CPI-deflated) residential
    property price index (2010=100) for Germany. It is a "selected" BIS indicator
    covering all types of owner-occupied new and existing dwellings across the whole
    country. The data is not seasonally adjusted and contains historical series backdated
    to 1970.
  context_window: 32
  forecast_horizon: 17
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: commerce_and_trade
  dataset_name: Quarterly_Germany_Residential_Property_Prices
  target_variable_names:
  - real residential property prices quarterly Germany
  covariate_variable_names: []
