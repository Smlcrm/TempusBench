task:
  task_name: Monthly Public Infrastructure Spending
  task_description: Monthly forecasting of U.S. public construction spending from
    Treasury yields, construction employment, materials prices, cement output, permits,
    and federal highway funding covariates.
  context_window: 180
  forecast_horizon: 12
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: construction_and_infrastructure
  dataset_name: Monthly_Public_Infrastructure_Spending
  target_variable_names:
  - Public construction spending
  covariate_variable_names:
  - 10-year Treasury yield
  - Construction employment
  - Construction materials producer price index
  - Cement and concrete output
  - Building permits
  - Infrastructure Investment and Jobs Act highway apportionment
