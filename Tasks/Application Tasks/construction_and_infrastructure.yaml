  task_description: Monthly forecasting of U.S. housing starts from building permits,
    mortgage rates, construction employment, housing supply, income, and lumber-price
    covariates.
  context_window: 180
  forecast_horizon: 12
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: construction_and_infrastructure
  dataset_name: Monthly_Housing_Starts
  target_variable_names:
  - Housing starts
  covariate_variable_names:
  - Building permits
  - 30-year fixed mortgage rate
  - Residential construction employment
  - Months supply of new houses
  - Real disposable personal income
  - Lumber producer price index
