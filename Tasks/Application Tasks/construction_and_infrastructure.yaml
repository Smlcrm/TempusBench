task:
  task_name: Monthly Construction Materials Cost
  task_description: Monthly forecasting of the construction materials producer price
    index from lumber, steel, concrete, chemical, copper, and broader macroeconomic
    covariates.
  context_window: 113
  forecast_horizon: 12
  handle_missing: interpolate
  normalization_method: standard
  task_catalog: application
  dataset_category: construction_and_infrastructure
  dataset_name: Monthly_Construction_Materials_Cost
  target_variable_names:
  - Construction materials producer price index
  covariate_variable_names:
  - Lumber producer price index
  - Steel mill products producer price index
  - Ready-mix concrete producer price index
  - Industrial chemicals producer price index
  - Copper global price
  - Broad dollar index
  - Housing starts
  - Industrial production
  - Cass freight shipments
