[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempus_bench"
version = "1.0.0"
description = "Time Series Forecasting Benchmarking Pipeline"
authors = [
    {name = "SMLCRM Team"}
]
readme = "README.md"
license = { text = "CC-BY-NC-ND-4.0" }
requires-python = ">=3.9"
dependencies = [
    # Core dependencies
    "joblib>=1.5.1",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "polars>=1.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "statsmodels>=0.14.0",
    "six>=1.17.0",
    "threadpoolctl>=3.6.0",
    "tzdata>=2025.2",
    # Configuration validation
    "pydantic>=2.0.0",
    # Progress bars
    "tqdm>=4.64.0",
    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    # TensorFlow and TensorBoard (optional - only needed if using TensorBoard logging)
    "tensorflow>=2.0.0",
    "tensorboard>=2.0.0",
    # Additional dependencies
    "click>=8.0.0",
    "psutil>=5.8.0",
    "conda-merge>=0.1.5",
    # Hugging Face dataset downloads (task CSVs)
    "huggingface_hub>=0.26.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "packaging>=23.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
]

[project.scripts]
run_benchmark = "tempus_bench.run_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempus_bench*"]

[tool.setuptools.package-data]
"tempus_bench" = ["**/*.yaml", "**/*.json", "**/*.txt", "**/*.md"]

[tool.pytest.ini_options]
markers = [
    "slow: CPU-heavy / diffusion (e.g. Sundial); run explicitly or exclude with -m \"not slow\"",
    "model_matrix: full per-model matrix; requires RUN_MODEL_MATRIX_TEST=1 for integration modules",
    "needs_weights: requires MODEL_WEIGHTS_PATH and local hf snapshot",
    "needs_conda: exercises conda subprocess / model executor; requires CONDA_MATRIX_TEST=1",
]
