test_type: deterministic
tensorboard: true
dataset:
  name: multivariate/baggage_months_multivariate
  split_ratio: [0.8, 0.1, 0.1]
  normalize: true
  handle_missing: interpolate
  chunks: 1

model:
  varmax:
    p: [1]
    q: [1]
    training_loss: ["mae"]
    forecast_horizon: [50]
    trend: ["c"]

evaluation:
  type: deterministic
  metrics: [mae, mase, rmse]
