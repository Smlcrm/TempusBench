test_type: deterministic
tensorboard: true
dataset:
  name: multivariate/baggage_months_multivariate
  split_ratio: [0.8, 0.1, 0.1]
  normalize: true
  handle_missing: interpolate
  chunks: 1

model:
  lstm:
    units: [32]
    layers: [1]
    dropout: [0.1]
    learning_rate: [0.01, 1.0]
    batch_size: [32]
    epochs: [20]
    sequence_length: [10]
    training_loss: ["mae"]
    forecast_horizon: [10]
    feature_cols: [null]
    context_length: [32]
    prediction_window: [8]

evaluation:
  type: deterministic
  metrics: [mae, mase, rmse]
