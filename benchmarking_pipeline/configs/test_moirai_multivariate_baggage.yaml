test_type: deterministic
tensorboard: true
dataset:
  name: multivariate/baggage_sales_multivariate
  split_ratio: [0.8, 0.1, 0.1]
  normalize: true
  handle_missing: interpolate
  chunks: 1

model:
  moirai:
    pdt: [6]
    ctx: [48]
    size: ["small"]

evaluation:
  type: deterministic
  metrics: [crps, interval_score]
  #metrics: [mae, mase, rmse]
